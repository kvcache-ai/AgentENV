// Wire-compatible subset of BuildKit's Apache-2.0 licensed Control API:
// https://github.com/moby/buildkit/blob/v0.33.0/api/services/control/control.proto
syntax = "proto3";
package moby.buildkit.v1;
import "google/protobuf/timestamp.proto";

service Control {
  rpc Status(StatusRequest) returns (stream StatusResponse);
  rpc ListenBuildHistory(BuildHistoryRequest) returns (stream BuildHistoryEvent);
}
message BuildHistoryRequest {
  bool ActiveOnly = 1;
  string Ref = 2;
  bool EarlyExit = 3;
}
message BuildHistoryEvent {
  int32 type = 1; // STARTED = 0, COMPLETE = 1, DELETED = 2
  BuildHistoryRecord record = 2;
}
message BuildHistoryRecord {
  string Ref = 1;
  repeated Exporter Exporters = 4;
  BuildError error = 5;
  BuildResultInfo Result = 10;
}
// Wire-compatible subset of google.rpc.Status.
message BuildError {
  int32 code = 1;
  string message = 2;
}
message Exporter {
  string Type = 1;
  map<string, string> Attrs = 2;
}
message BuildResultInfo {
  map<int64, Descriptor> Results = 3;
}
message Descriptor {
  string digest = 2;
}

message StatusRequest { string Ref = 1; }
message StatusResponse {
  repeated Vertex vertexes = 1;
  repeated VertexLog logs = 3;
  repeated VertexWarning warnings = 4;
}
message Vertex {
  string digest = 1;
  string name = 3;
  bool cached = 4;
  google.protobuf.Timestamp started = 5;
  google.protobuf.Timestamp completed = 6;
  string error = 7;
}
message VertexLog {
  string vertex = 1;
  google.protobuf.Timestamp timestamp = 2;
  int64 stream = 3;
  bytes msg = 4;
}
message VertexWarning {
  string vertex = 1;
  int64 level = 2;
  bytes short = 3;
  repeated bytes detail = 4;
}
