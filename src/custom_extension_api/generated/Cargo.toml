[package]
name = "custom_extension_client"
version = "0.1.0"
authors = ["OpenAPI Generator team and contributors"]
description = "HTTP API implemented by the custom extension service configured via [custom_extension].url. The custom extension currently supports sandbox lifecycle hooks (under /sandbox-hook/_*), invoked by the AENV Firecracker sandbox runtime; more capabilities may be added in the future. The runtime treats any connection error, timeout, or non-2xx response as a failure of the corresponding sandbox operation (except the best-effort stop notification). Instance identity: sandboxId alone is reused across pause/resume cycles, so every start-fresh / start-resume hook carries a fresh sandboxInstanceId that uniquely identifies one runtime instance of the sandbox. The stop hook carries the sandboxInstanceId of the instance being torn down. Because the stop notification is best-effort and may be delivered out of order (e.g. a pause's stop arriving after the resume's start-resume), the extension should treat (sandboxId, sandboxInstanceId) as the identity of a running instance and ignore stop notifications whose sandboxInstanceId is not the latest started instance for that sandbox. The in-place pause+resume performed during snapshot capture does not fire the stop hook and does not change the instance id."
# Override this license by providing a License Object in the OpenAPI.
license = "Unlicense"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
chrono = { version = "^0.4",  features = ["serde"] }
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
