schemas:
  CPUCount:
    type: integer
    format: int32
    minimum: 1
    description: CPU cores for the sandbox

  MemoryMB:
    type: integer
    format: int32
    minimum: 128
    description: Memory for the sandbox in MiB

  DiskSizeMB:
    type: integer
    format: int32
    minimum: 0
    description: Disk size for the sandbox in MiB

  EnvdVersion:
    type: string
    description: Version of the envd running in the sandbox

  Error:
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int32
        description: Error code
      message:
        type: string
        description: Error
