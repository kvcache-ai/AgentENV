schemas:
  Template:
    required:
      - templateID
      - buildID
      - cpuCount
      - memoryMB
      - diskSizeMB
      - public
      - createdAt
      - updatedAt
      - createdBy
      - lastSpawnedAt
      - spawnCount
      - buildCount
      - envdVersion
      - aliases
      - names
      - buildStatus
    properties:
      templateID:
        type: string
        description: Identifier of the template
      buildID:
        type: string
        description: Identifier of the last successful build for given template
      cpuCount:
        $ref: "#/components/schemas/CPUCount"
      memoryMB:
        $ref: "#/components/schemas/MemoryMB"
      diskSizeMB:
        $ref: "#/components/schemas/DiskSizeMB"
      public:
        type: boolean
        description: Whether the template is public or only accessible by the team
      names:
        type: array
        description: Names of the template (namespace/alias format when namespaced)
        items:
          type: string
      createdAt:
        type: string
        format: date-time
        description: Time when the template was created
      updatedAt:
        type: string
        format: date-time
        description: Time when the template was last updated
      lastSpawnedAt:
        type: string
        nullable: true
        format: date-time
        description: Time when the template was last used
      spawnCount:
        type: integer
        format: int64
        description: Number of times the template was used
      buildCount:
        type: integer
        format: int32
        description: Number of times the template was built
      envdVersion:
        $ref: "#/components/schemas/EnvdVersion"
      buildStatus:
        $ref: "#/components/schemas/TemplateBuildStatus"

  TemplateRequestResponseV3:
    required:
      - templateID
      - buildID
      - public
      - aliases
      - names
      - tags
    properties:
      templateID:
        type: string
        description: Identifier of the template
      buildID:
        type: string
        description: Identifier of the last successful build for given template
      public:
        type: boolean
        description: Whether the template is public or only accessible by the team
      names:
        type: array
        description: Names of the template
        items:
          type: string
      tags:
        type: array
        description: Tags assigned to the template build
        items:
          type: string
      aliases:
        type: array
        description: Aliases of the template
        deprecated: true
        items:
          type: string

  TemplateBuild:
    required:
      - buildID
      - status
      - createdAt
      - updatedAt
      - cpuCount
      - memoryMB
    properties:
      buildID:
        type: string
        format: uuid
        description: Identifier of the build
      status:
        $ref: "#/components/schemas/TemplateBuildStatus"
      createdAt:
        type: string
        format: date-time
        description: Time when the build was created
      updatedAt:
        type: string
        format: date-time
        description: Time when the build was last updated
      finishedAt:
        type: string
        format: date-time
        description: Time when the build was finished
      cpuCount:
        $ref: "#/components/schemas/CPUCount"
      memoryMB:
        $ref: "#/components/schemas/MemoryMB"
      diskSizeMB:
        $ref: "#/components/schemas/DiskSizeMB"
      envdVersion:
        $ref: "#/components/schemas/EnvdVersion"

  TemplateWithBuilds:
    required:
      - templateID
      - public
      - aliases
      - names
      - createdAt
      - updatedAt
      - lastSpawnedAt
      - spawnCount
      - builds
    properties:
      templateID:
        type: string
        description: Identifier of the template
      public:
        type: boolean
        description: Whether the template is public or only accessible by the team
      names:
        type: array
        description: Names of the template (namespace/alias format when namespaced)
        items:
          type: string
      createdAt:
        type: string
        format: date-time
        description: Time when the template was created
      updatedAt:
        type: string
        format: date-time
        description: Time when the template was last updated
      lastSpawnedAt:
        type: string
        nullable: true
        format: date-time
        description: Time when the template was last used
      spawnCount:
        type: integer
        format: int64
        description: Number of times the template was used
      builds:
        type: array
        description: List of builds for the template
        items:
          $ref: "#/components/schemas/TemplateBuild"

  TemplateAliasResponse:
    required:
      - templateID
      - public
    properties:
      templateID:
        type: string
        description: Identifier of the template
      public:
        type: boolean
        description: Whether the template is public or only accessible by the team

  TemplateStep:
    description: Step in the template build process
    required:
      - type
    properties:
      type:
        type: string
        description: Type of the step
      args:
        default: []
        type: array
        description: Arguments for the step
        items:
          type: string
      filesHash:
        type: string
        description: Hash of the files used in the step
      force:
        default: false
        type: boolean
        description: Whether the step should be forced to run regardless of the cache

  TemplateBuildRequestV3:
    properties:
      name:
        description: Name of the template. Can include a tag with colon separator (e.g. "my-template" or "my-template:v1"). If tag is included, it will be treated as if the tag was provided in the tags array.
        type: string
        maxLength: 128
      tags:
        type: array
        description: Tags to assign to the template build
        items:
          type: string
      cpuCount:
        $ref: "#/components/schemas/CPUCount"
      memoryMB:
        $ref: "#/components/schemas/MemoryMB"

  TemplateBuildStartV2:
    type: object
    properties:
      fromImage:
        type: string
        description: Image to use as a base for the template build
      fromTemplate:
        type: string
        description: Template to use as a base for the template build
      force:
        default: false
        type: boolean
        description: Whether the whole build should be forced to run regardless of the cache
      steps:
        default: []
        description: List of steps to execute in the template build
        type: array
        items:
          $ref: "#/components/schemas/TemplateStep"
      startCmd:
        description: Start command to execute in the template after the build
        type: string
      readyCmd:
        description: Ready check command to execute in the template after the build
        type: string

  LogLevel:
    type: string
    description: State of the sandbox
    enum:
      - debug
      - info
      - warn
      - error

  BuildLogEntry:
    required:
      - timestamp
      - message
      - level
    properties:
      timestamp:
        type: string
        format: date-time
        description: Timestamp of the log entry
      message:
        type: string
        description: Log message content
      level:
        $ref: "#/components/schemas/LogLevel"
      step:
        type: string
        description: Step in the build process related to the log entry

  BuildStatusReason:
    required:
      - message
    properties:
      message:
        type: string
        description: Message with the status reason, currently reporting only for error status
      step:
        type: string
        description: Step that failed
      logEntries:
        default: []
        description: Log entries related to the status reason
        type: array
        items:
          $ref: "#/components/schemas/BuildLogEntry"

  TemplateBuildStatus:
    type: string
    description: Status of the template build
    enum:
      - building
      - waiting
      - ready
      - error

  TemplateBuildInfo:
    required:
      - templateID
      - buildID
      - status
      - logs
      - logEntries
    properties:
      logs:
        default: []
        description: Build logs
        type: array
        items:
          type: string
      logEntries:
        default: []
        description: Build logs structured
        type: array
        items:
          $ref: "#/components/schemas/BuildLogEntry"
      templateID:
        type: string
        description: Identifier of the template
      buildID:
        type: string
        description: Identifier of the build
      status:
        $ref: "#/components/schemas/TemplateBuildStatus"
      reason:
        $ref: "#/components/schemas/BuildStatusReason"
