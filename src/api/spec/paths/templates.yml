paths:
/v3/templates:
  post:
    summary: Create template (v3)
    description: Create a new template
    tags: [templates]
    security:
      - ApiKeyAuth: []
      - AuthProviderBearerAuth: []
        AuthProviderTeamAuth: []
      - AdminApiKeyAuth: []
        AdminTeamAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TemplateBuildRequestV3"

    responses:
      "202":
        description: The build was requested successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateRequestResponseV3"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "500":
        $ref: "#/components/responses/500"

/v2/templates:
  get:
    summary: List templates (v2)
    description: List all templates
    tags: [templates]
    security:
      - ApiKeyAuth: []
      - AccessTokenAuth: []
      - AuthProviderBearerAuth: []
        AuthProviderTeamAuth: []
      - AdminApiKeyAuth: []
        AdminTeamAuth: []
    parameters:
      - in: query
        required: false
        name: teamID
        schema:
          type: string
          description: Identifier of the team
      - $ref: "#/components/parameters/paginationNextToken"
      - $ref: "#/components/parameters/paginationLimit"
    responses:
      "200":
        description: Successfully returned all templates
        headers:
          X-Next-Token:
            description: Cursor to fetch the next page of results, if more exist
            schema:
              type: string
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Template"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "500":
        $ref: "#/components/responses/500"

/templates:
  get:
    summary: List templates
    description: List all templates
    deprecated: true
    tags: [templates]
    security:
      - ApiKeyAuth: []
      - AccessTokenAuth: []
      - AuthProviderBearerAuth: []
        AuthProviderTeamAuth: []
      - AdminApiKeyAuth: []
        AdminTeamAuth: []
    parameters:
      - in: query
        required: false
        name: teamID
        schema:
          type: string
          description: Identifier of the team
    responses:
      "200":
        description: Successfully returned all templates
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Template"
      "401":
        $ref: "#/components/responses/401"
      "500":
        $ref: "#/components/responses/500"

/templates/{templateID}:
  get:
    summary: List template builds
    description: List all builds for a template
    tags: [templates]
    security:
      - ApiKeyAuth: []
      - AuthProviderBearerAuth: []
        AuthProviderTeamAuth: []
      - AdminApiKeyAuth: []
        AdminTeamAuth: []
    parameters:
      - $ref: "#/components/parameters/templateID"
      - $ref: "#/components/parameters/paginationNextToken"
      - $ref: "#/components/parameters/paginationLimit"
    responses:
      "200":
        description: Successfully returned the template with its builds
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateWithBuilds"
      "401":
        $ref: "#/components/responses/401"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
  delete:
    summary: Delete template
    description: Delete a template
    tags: [templates]
    security:
      - ApiKeyAuth: []
      - AccessTokenAuth: []
      - AuthProviderBearerAuth: []
        AuthProviderTeamAuth: []
      - AdminApiKeyAuth: []
        AdminTeamAuth: []
    parameters:
      - $ref: "#/components/parameters/templateID"
    responses:
      "204":
        description: The template was deleted successfully
      "401":
        $ref: "#/components/responses/401"
      "500":
        $ref: "#/components/responses/500"

/v2/templates/{templateID}/builds/{buildID}:
  post:
    summary: Start template build (v2)
    description: Start the build
    tags: [templates]
    security:
      - ApiKeyAuth: []
      - AuthProviderBearerAuth: []
        AuthProviderTeamAuth: []
      - AdminApiKeyAuth: []
        AdminTeamAuth: []
    parameters:
      - $ref: "#/components/parameters/templateID"
      - $ref: "#/components/parameters/buildID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TemplateBuildStartV2"
    responses:
      "202":
        description: The build has started
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"

/templates/{templateID}/builds/{buildID}/status:
  get:
    summary: Template build status
    description: Get template build info
    tags: [templates]
    security:
      - AccessTokenAuth: []
      - ApiKeyAuth: []
      - AuthProviderBearerAuth: []
        AuthProviderTeamAuth: []
      - AdminApiKeyAuth: []
        AdminTeamAuth: []
    parameters:
      - $ref: "#/components/parameters/templateID"
      - $ref: "#/components/parameters/buildID"
    responses:
      "200":
        description: Successfully returned the template
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateBuildInfo"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"

/templates/aliases/{alias}:
  get:
    summary: Check template alias
    description: Check if template with given alias exists
    tags: [templates]
    security:
      - ApiKeyAuth: []
      - AuthProviderBearerAuth: []
        AuthProviderTeamAuth: []
      - AdminApiKeyAuth: []
        AdminTeamAuth: []
    parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
          description: Template alias
    responses:
      "200":
        description: Successfully queried template by alias
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateAliasResponse"
      "400":
        $ref: "#/components/responses/400"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
