name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: "Log level for the tests"
        required: false
  pull_request:
    paths-ignore: &ignore_docs
      - "**.md"
      - "**.rst"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/benchmark.yml"
      - ".github/workflows/e2b-benchmark.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/coverage.yml"
      - ".github/workflows/services-ci.yml"
      - ".github/workflows/mutation-tests.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  push:
    paths-ignore: *ignore_docs

env:
  RUST_LOG: ${{ github.event.inputs.log_level || 'info' }}

permissions:
  contents: read
  packages: read

jobs:
  agentenv-tests:
    # Ubuntu 24.04's Linux 6.17 kernel can crash in ublk ADD_DEV.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
        with:
          ci_deps_target: ci-deps
      - uses: ./.github/actions/sandbox-ci-setup
        with:
          ghcr_username: ${{ github.actor }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      - name: AgentEnv Integration tests
        run: sg kvm -c "make test-agent-integration PROFILE=debug"
      - uses: ./.github/actions/sandbox-artifacts-cleanup
        if: always()

  e2e-tests:
    name: e2e-tests (${{ matrix.e2e_name }})
    # Ubuntu 24.04's Linux 6.17 kernel can crash in ublk ADD_DEV.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - e2e_name: single-node
            make_target: test-e2e
          - e2e_name: docker-compose
            make_target: test-e2e-compose
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
        if: ${{ matrix.e2e_name == 'single-node' }}
        with:
          ci_deps_target: ci-deps
      - uses: ./.github/actions/sandbox-ci-setup
        if: ${{ matrix.e2e_name == 'single-node' }}
        with:
          ghcr_username: ${{ github.actor }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure ublk test host
        if: ${{ matrix.e2e_name != 'single-node' }}
        run: sudo scripts/tests/setup-ublk-access.sh "$(id -un)" "$(id -gn)"
      - name: Set up Docker Buildx
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: docker/setup-buildx-action@v4
      - name: Build AgentENV runtime image
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.agentenv
          load: true
          tags: agentenv-runtime:latest
          cache-from: type=gha,scope=agentenv-runtime
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=agentenv-runtime,mode=max' || '' }}
      - name: Build gateway image
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.gateway
          load: true
          tags: agentenv-gateway:latest
          cache-from: type=gha,scope=agentenv-gateway
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=agentenv-gateway,mode=max' || '' }}
      - name: Build scheduler image
        if: ${{ matrix.e2e_name == 'docker-compose' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.scheduler
          load: true
          tags: agentenv-scheduler:latest
          cache-from: type=gha,scope=agentenv-scheduler
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=agentenv-scheduler,mode=max' || '' }}
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install e2b CLI
        run: npm install -g @e2b/cli
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install e2b Python SDK
        run: python3 -m pip install --upgrade e2b e2b-code-interpreter
      - name: E2E tests (${{ matrix.e2e_name }})
        env:
          RUN_BUILDKIT_TESTS: ${{ matrix.e2e_name == 'single-node' && '1' || '0' }}
          BUILDCTL_BIN: ${{ runner.temp }}/buildkit/bin/buildctl
        run: |
          if [[ "${{ matrix.e2e_name }}" == "single-node" ]]; then
            version="$(<config/buildkit-version)"
            asset="buildkit-${version}.linux-amd64.tar.gz"
            mkdir -p "$RUNNER_TEMP/buildkit"
            curl -fsSL --retry 5 "https://api.github.com/repos/moby/buildkit/releases/tags/$version" >"$RUNNER_TEMP/buildkit/release.json"
            url=$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url' "$RUNNER_TEMP/buildkit/release.json")
            digest=$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' "$RUNNER_TEMP/buildkit/release.json")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            curl -fsSL --retry 5 "$url" -o "$RUNNER_TEMP/buildkit/client.tar.gz"
            echo "${digest#sha256:}  $RUNNER_TEMP/buildkit/client.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/buildkit/client.tar.gz" -C "$RUNNER_TEMP/buildkit" bin/buildctl
            python3 -m pip install tomli-w
            python3 - <<'PY'
          import pathlib, tomllib, tomli_w
          path = pathlib.Path("config/default.toml")
          config = tomllib.loads(path.read_text())
          config["template_build"].update(builder_cpu_count=2, builder_memory_mb=2048, cache_size_mb=8192)
          path.write_text(tomli_w.dumps(config))
          PY
            sg kvm -c "make ${{ matrix.make_target }} PROFILE=debug"
          else
            SKIP_BUILD=1 make ${{ matrix.make_target }} PROFILE=debug
          fi
      - uses: ./.github/actions/sandbox-artifacts-cleanup
        if: always()
