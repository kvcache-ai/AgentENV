name: Services CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/**"
      - "deploy/**"
      - ".github/workflows/services-ci.yml"
  push:
    paths:
      - "services/**"
      - "deploy/**"
      - ".github/workflows/services-ci.yml"

jobs:
  go-services:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/go.mod
          cache-dependency-path: |
            services/go.sum
            services/go.mod
      - name: Build services
        run: make build
      - name: Install Redis server for scheduler tests
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Test services
        run: make test
      - name: Go format check
        run: make fmt-check
      - name: Go vet
        run: make vet
