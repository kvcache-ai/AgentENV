name: Publish Compose Image

on:
  workflow_dispatch:
    inputs:
      compose_version:
        description: Immutable SemVer tag for the Compose guest image
        required: true
        type: string

jobs:
  publish:
    name: Publish linux/amd64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version and immutable tag
        env:
          COMPOSE_VERSION: ${{ inputs.compose_version }}
        run: |
          if [[ ! "$COMPOSE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "compose_version must be MAJOR.MINOR.PATCH, got '$COMPOSE_VERSION'." >&2
            exit 1
          fi
          image="ghcr.io/$OWNER/agentenv-compose:$COMPOSE_VERSION"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Refusing to overwrite published Compose image $image." >&2
            exit 1
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      # The Compose runtime supports only linux/amd64 guests.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: compose-image/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          push: true
