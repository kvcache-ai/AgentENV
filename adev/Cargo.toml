[package]
name = "adev"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AENV dev/CI tooling CLI"

[[bin]]
name = "adev"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking", "rustls"], default-features = false }
indicatif = "0.17"
which = "8"
zip = "2"
regex = "1"
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
upon = { version = "0.10", default-features = false, features = ["serde"] }
