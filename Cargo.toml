[package]
name = "agentenv"
version.workspace = true
edition = "2021"
license = "MIT"

[workspace]
members = [
    ".",
    "adev",
    "crates/aenv",
    "crates/benchmarks",
    "crates/e2e-tests",
    "crates/linux-cap",
    "crates/observability",
    "crates/object-store-operator",
    "crates/test-support",
    "crates/shell-util",
    "crates/warm-pool",
    "src/api/generated",
    "src/custom_extension_api/generated",
    "thirdparty/firecracker-client",
    "thirdparty/envd",
    "storage/util",
    "storage/overlaybd",
    "storage/ublk",
    "storage/ublk-daemon",
]

[workspace.package]
version = "0.2.3"

[workspace.lints.clippy]
assigning_clones = "warn"
borrow_as_ptr = "warn"
branches_sharing_code = "warn"
case_sensitive_file_extension_comparisons = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
create_dir = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
duration_suboptimal_units = "warn"
empty_drop = "warn"
enum_glob_use = "warn"
explicit_iter_loop = "warn"
fallible_impl_from = "warn"
format_collect = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
manual_string_new = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
missing_fields_in_debug = "warn"
mutex_atomic = "warn"
needless_pass_by_ref_mut = "warn"
option_option = "warn"
ptr_cast_constness = "warn"
rc_buffer = "warn"
redundant_else = "warn"
ref_option = "warn"
set_contains_or_insert = "warn"
todo = "warn"
too_many_lines = "warn"
trait_duplication_in_bounds = "warn"
transmute_ptr_to_ptr = "warn"
try_err = "warn"
unchecked_time_subtraction = "warn"
unimplemented = "warn"
unnecessary_box_returns = "warn"
unnecessary_semicolon = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_result_ok = "warn"
unused_self = "warn"
unwrap_used = "warn"
used_underscore_items = "warn"
verbose_file_reads = "warn"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
vendored-openssl = ["dep:openssl-sys", "openssl-sys/vendored"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dependencies]
firecracker_client = { version = "1.15.1", path = "thirdparty/firecracker-client" }
envd = { version = "0.1.0", path = "thirdparty/envd" }
custom_extension_client = { version = "0.1.0", path = "src/custom_extension_api/generated" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
opendal = { version = "0.55.0", features = ["services-oss", "services-s3"] }
object-store-operator = { path = "crates/object-store-operator" }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
httparse = "1.10"
tls-parser = "0.12.2"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rocksdb = "0.24.0"
tower = "0.5.2"
anyhow = "1.0.100"
tempfile = "3.22.0"
nix = { version = "0.30", features = ["sched", "mount", "fs", "signal", "user", "resource", "uio"] }
libc = "0.2"
rtnetlink = "0.20"
netlink-packet-route = "0.28"
ipnetwork = { version = "0.21", features = ["serde"] }
hickory-resolver = "0.26.1"
futures = "0.3"
tonic = "0.14.2"
tonic-prost = "0.14.2"
prost = "0.14.3"
prost-types = "0.14.3"
thiserror = "2.0.18"
index-set = "0.2"
uuid = { version = "1", features = ["serde", "v7"] }
toml = "0.9.11"
confique = { version = "0.4.0", features = ["toml"] }
which = "8.0.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
metrics = "0.24"
agentenv-observability = { path = "crates/observability" }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
agentenv_http_server = { path = "src/api/generated" }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.12", features = [
    "cookie",
    "query",
    "typed-header",
] }
bytes = "1"
headers = "0.4"
http = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
url = "2.5"
clap = { version = "4", features = ["derive"] }
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
uvm-ublk = { path = "storage/ublk" }
uvm-ublk-daemon = { path = "storage/ublk-daemon" }
shell-util = { path = "crates/shell-util" }
linux-cap = { path = "crates/linux-cap" }
warm-pool = { path = "crates/warm-pool" }
ublk-sys = { package = "libublk-rs-sys", git = "https://github.com/ublk-org/libublk-rs.git", rev = "c6a3e06" }
overlaybd = { path = "storage/overlaybd" }
storage-util = { path = "storage/util" }
dashmap = "6.1.0"
io-uring = "0.7.9"
tokio-tungstenite = "0.28"
sha2 = { version = "0.10", features = ["asm"] }
hmac = "0.12"
subtle = "2.6"
hex = "0.4"
semver = "1"
iroh = "1.0.3"
iroh-blobs = "0.103.0"
rand = "0.10"
flate2 = "1"
tar = "0.4"
openssl-sys = { version = "0.9", optional = true }

[build-dependencies]
tonic-prost-build = "0.14.2"

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.crypto-common]
opt-level = 3

[profile.dev.package.rocksdb]
opt-level = 3
debug = 0

[profile.dev.package.librocksdb-sys]
opt-level = 3
debug = 0

[profile.test.package.rocksdb]
opt-level = 3
debug = 0

[profile.test.package.librocksdb-sys]
opt-level = 3
debug = 0
