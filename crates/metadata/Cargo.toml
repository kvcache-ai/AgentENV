[package]
name = "agentenv-metadata"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AgentENV metadata database connections, migrations and administration"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "sqlite-bundled", "migrate", "macros"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
futures = "0.3"
tempfile = "3.22.0"

[[bin]]
name = "aenv-metadata"
path = "src/main.rs"
