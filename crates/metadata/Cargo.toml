[package]
name = "agentenv-metadata"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AgentENV metadata service and database administration"

[dependencies]
agentenv-domain = { path = "../domain" }
anyhow = "1.0.100"
async-trait = "0.1"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "sqlite-bundled", "migrate", "macros", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1.41"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
agentenv-domain = { path = "../domain", features = ["test-support"] }
futures = "0.3"
tempfile = "3.22.0"
tokio = { version = "1", features = ["time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7"] }
