[package]
name = "object-store-operator"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
opendal = { version = "0.55.0", features = ["services-s3"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
