[package]
name = "agentenv-domain"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared AgentENV domain records and values"

[features]
test-support = []

[dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v7"] }
shell-util = { path = "../shell-util" }
