[package]
name = "agentenv-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
agentenv = { path = "../.." }
anyhow = "1.0.100"
criterion = { version = "0.8", features = ["async_tokio"] }
libc = "0.2"
overlaybd = { path = "../../storage/overlaybd" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
storage-util = { path = "../../storage/util" }
tempfile = "3.22.0"
tokio = { version = "1", features = ["full"] }
ublk-sys = { package = "libublk-rs-sys", git = "https://github.com/ublk-org/libublk-rs.git", rev = "c6a3e06" }
uuid = "1"
uvm-ublk = { path = "../../storage/ublk" }

[[bench]]
name = "snapshot"
path = "benches/snapshot_benchmark.rs"
harness = false

[[bench]]
name = "ublk_overlaybd"
path = "benches/ublk_overlaybd_benchmark.rs"
harness = false

[[bench]]
name = "orchestrator_store"
path = "benches/orchestrator_store_benchmark.rs"
harness = false

[[bench]]
name = "oci_conversion_pipeline"
path = "benches/oci_conversion_pipeline_benchmark.rs"
harness = false
