[package]
name = "aenv"
version.workspace = true
edition = "2021"

[[bin]]
name = "aenv"
path = "src/main.rs"

[features]
vendored-openssl = ["dep:openssl-sys", "openssl-sys/vendored"]

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
crossterm = "0.28"
directories = "5"
envd = { path = "../../thirdparty/envd" }
futures = "0.3"
indicatif = "0.17"
openssl-sys = { version = "0.9", optional = true }
parse-dockerfile = { version = "0.1.8", default-features = false }
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "rustls", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.16"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
ureq = { version = "2", features = ["json", "tls"] }
walkdir = "2"
shell-util = { path = "../../crates/shell-util" }
uuid = "1"
