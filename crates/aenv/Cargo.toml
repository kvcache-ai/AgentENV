[package]
name = "aenv"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aenv"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "5"
envd = { path = "../../thirdparty/envd" }
futures = "0.3"
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "rustls", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.16"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
toml = "0.9"
ureq = { version = "2", features = ["json", "tls"] }
walkdir = "2"
shell-util = { path = "../../crates/shell-util" }
uuid = "1"
