[package]
name = "aenv-compose-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
runtime = ["dep:anyhow", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = { version = "1", optional = true }
tokio = { version = "1", optional = true, features = ["fs", "io-std", "io-util", "macros", "process", "rt", "signal", "time"] }

[dev-dependencies]
libc = "0.2"
tempfile = "3"

[[bin]]
name = "aenv-compose-init"
path = "src/bin/init.rs"
required-features = ["runtime"]

[[bin]]
name = "aenv-compose-start"
path = "src/bin/start.rs"
required-features = ["runtime"]
