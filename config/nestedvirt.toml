# Opt-in x86_64 nested KVM node. Keep its state separate and rebuild templates.
# Install matching artifacts before starting the server; see the nested KVM guide.
home_path = "/var/lib/aenv-nestedvirt"
runtime_path = "/run/aenv-nestedvirt"
deps_path = "/opt/agentenv-nestedvirt/deps"
virtualization_mode = "kvm"

[firecracker]
# Complete string replacement; retain shipped boot/DAMON settings.
# no-kvmapf is a tested workaround for this optional nested-KVM node only.
boot_args = "console=ttyS0 reboot=k panic=1 pci=off mitigations=off init=/init page_reporting.page_reporting_order=6 damon_reclaim.enabled=Y damon_reclaim.min_age=100000 damon_reclaim.quota_ms=20 damon_reclaim.quota_sz=1073741824 damon_reclaim.quota_reset_interval_ms=500 damon_reclaim.wmarks_high=990 damon_reclaim.wmarks_mid=990 damon_reclaim.wmarks_low=200 damon_reclaim.skip_anon=Y damon_reclaim.wmarks_interval=1000000 no-kvmapf"
version = "1.15.1-nestedvirt-c7e1cce"
binary_path = "/opt/agentenv-nestedvirt/deps/firecracker/1.15.1-nestedvirt-c7e1cce/firecracker"

[kernel]
image_path = "/opt/agentenv-nestedvirt/vmlinux-6.18-agentenv-nestedvirt-x86_64"

[snapshot]
repository_backend = "posix_fs"

[observability.scheduler_report]
enabled = false
