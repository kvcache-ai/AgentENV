# AgentENV configuration for OSS-backed snapshot repository tests and validation.
# This mirrors config/default.toml but selects the OSS snapshot backend.
#
# Runtime dependency versions and download URLs live in
# config/deps_manifest.toml. Set explicit paths here to override packaged
# setup assets.
#
# Common test overrides:
#   AENV_DEPS_PATH
#   AENV_SNAPSHOT_LOCAL_CACHE_PATH

home_path = "../env"
# Node-wide mutually exclusive virtualization backend. Override with
# AENV_VIRTUALIZATION_MODE.
virtualization_mode = "kvm"
# OSS validation keeps its downloaded dependencies directly under ../env.
deps_path = "../env"

[firecracker]
boot_args = "console=ttyS0 reboot=k panic=1 pci=off mitigations=off init=/init"
# Optional allowlist for cold-start extraBootArgs prefixes. If omitted or empty,
# no request-provided extra boot args are appended.
# allowed_extra_boot_args_prefixes = ["aenv-custom."]
socket_timeout_secs = 3
socket_poll_ms = 1
# Firecracker work and serial directories derive from home_path.
# Optional Firecracker log level. When set to a non-empty value (Error, Warning,
# Info, Debug, or Trace), Firecracker's own logging is enabled and written to a
# `firecracker.log` file in the same per-sandbox log directory as the serial
# output. Leave unset/empty to disable Firecracker logging (default).
# log_level = "Info"

[kernel]

[tools]
# version = "0.1.0-custom.1"               # required with drive_path
# drive_path = "../env/tools/tools.ext4"   # imported into the versioned dependency directory
control_plane_port = 49983

[image.resolver]
default_image = "ubuntu:24.04"
search_registries = ["docker.io", "ghcr.io"]
# Whitelist of registry hosts. Omit the key (as below) for no restriction;
# When set to a non-empty list, only references whose registry host is in the list resolve;
# anything else is rejected as a client (4xx) error.
# allowed_registries = ["docker.io", "ghcr.io"]
try_referrers_overlaybd_prefixes = []

[image.cache]
capacity_gb = 100

[image.cache.remote_blocks]
max_size_gb = 10

[image.cache.gc]
enabled = true
interval_secs = 1800
min_age_secs = 600
high_watermark_ratio = 0.95
low_watermark_ratio = 0.70

[p2p]
enabled = false
transport = "iroh"
listen_addr = "0.0.0.0:0"
lookup_timeout_ms = 5000
fetch_timeout_ms = 30000
peer_discovery_refresh_interval_secs = 5

[cluster]
# Shared gRPC endpoint for cluster-level services such as scheduler heartbeat
# reporting and P2P peer discovery (e.g. "http://127.0.0.1:9090").
# scheduler_endpoint = "http://127.0.0.1:9090"

[machine]
mem_size_mib = 1024
vcpu_count = 2

[envd]
version = "0.5.15"
init_timeout_secs = 60
poll_ms = 3

[orchestrator]
auto_evict_interval_ms = 1000
default_sandbox_timeout_secs = 15
auto_resume_min_sandbox_timeout_secs = 300

[snapshot]
repository_backend = "oss"
p2p_enabled = true

# Advanced: only takes effect with repository_backend = "oss". Enable only when
# source images already live in an overlaybd-capable registry and AgentENV has
# push credentials (from ~/.docker/config.json). When enabled, AgentENV
# publishes each snapshot rootfs as a new overlaybd image tag
# "agentenv-snapshot-{snapshot_id}" in the original source registry: existing
# remote layers are referenced by digest and only new delta layers are
# uploaded, so the snapshot can also be addressed and reused as an image
# version there. The published reference is returned as `imageRef` in snapshot
# APIs. Memory and VM-state artifacts always stay in the snapshot repository.
# Locally converted (non-overlaybd) source images fall back to object storage;
# incompatible remote-backed layouts fail the publish instead of mixing
# sources.
[snapshot.image_publish]
enabled = true

[backend.oss]
endpoint = "http://127.0.0.1:9000"
bucket = "unused"
region = "us-east-1"
prefix = "unused"
access_key_id = "minioadmin"
access_key_secret = "minioadmin"
cache_max_size_gb = 10

[ublk]
enabled = true
daemon_metrics_listen_addr = "0.0.0.0:9103"
device_type = "overlaybd"

[ublk.overlaybd]
read_only = false
runtime_upper_mode = "hybridLogStructured"
allow_shrink = false
resize_timeout_secs = 120
download_enable = false
p2p_lookup_timeout_ms = 300
p2p_fetch_range_timeout_ms = 2000

[pool]
low_watermark = 2
high_watermark = 64

[pool.network]
maintenance_enabled = true

[pool.block]
enabled = true
startup_prewarm = true

[pool.firecracker]
enabled = true
startup_prewarm = true
fill_concurrency = 4

[memory_snapshot]
# Experimental: create memory overlaybd layers directly from Firecracker dirty
# ranges via process_vm_readv, skipping the intermediate mem.bin file.
direct_overlaybd = true

[memory_snapshot.background_download]
enable = true
delay = 0 # delay after envd is ready (downloads never start before envd readiness; a 20s fallback applies if the ready signal is lost)
delay_extra = 1 # random extra delay is [0, delay_extra), so 1 adds no jitter
try_cnt = 5
block_size = 16777216 # 16 MiB per block; peak scratch memory is block_size * concurrency per layer download
concurrency = 4 # max in-flight block remote reads per remote layer; layers download sequentially
max_inflight_blocks = 16 # process-wide cap on in-flight download blocks shared by every layer download

[observability]
enabled = true

[observability.scheduler_report]
enabled = false
interval_secs = 5
