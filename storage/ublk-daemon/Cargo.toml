[package]
name = "uvm-ublk-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
uvm-ublk = { path = "../ublk" }
overlaybd = { path = "../overlaybd" }
storage-util = { path = "../util" }
warm-pool = { path = "../../crates/warm-pool" }
agentenv-observability = { path = "../../crates/observability" }
linux-cap = { path = "../../crates/linux-cap" }

anyhow = "1.0"
clap = { version = "4.5.38", features = ["derive"] }
dashmap = "6.1.0"
io-uring = "0.7.9"
libc = "0.2.174"
nix = { version = "0.30.1", features = ["process", "signal", "resource"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.11"
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
tracing-log = "0.2.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"
