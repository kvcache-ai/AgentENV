[package]
name = "overlaybd"
version = "0.1.0"
edition = "2021"

[features]
default = ["full"]
full = [
    "dep:reqwest",
    "dep:base64",
    "dep:object-store-operator",
]
io-uring = ["storage-util/io-uring"]

[dependencies]
storage-util = { path = "../util" }
tokio = { version = "1.44.2", features = ["full"] }
async-trait = "0.1.88"
futures-util = "0.3.31"
bytes = "1.11.0"
parking_lot = "0.12.5"
crossbeam-channel = "0.5"
zerocopy = { version = "0.8.36", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "fast-rng"] }
crc32c = "0.6"
lz4-sys = "1.11"
zstd = "0.13.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10.9"
tracing = "0.1.41"
metrics = "0.24"
dashmap = "6.1.0"
roaring = "0.10"
nix = { version = "0.30.1", features = ["fs", "uio"] }
libc = "0.2.174"
anyhow = "1.0"
thiserror = "2.0"

# Optional (feature "full")
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
base64 = { version = "0.22.1", optional = true }
object-store-operator = { path = "../../crates/object-store-operator", optional = true }

[dev-dependencies]
rand = "0.10"
tempfile = "3"
axum = "0.8.6"
clap = { version = "4.5.38", features = ["derive"] }
agentenv-test-support = { path = "../../crates/test-support" }
tar = "0.4"
criterion = "0.8"
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }

[[example]]
name = "generate_image_config"
required-features = ["full"]

[[bench]]
name = "zfile_read"
path = "benches/zfile_read_benchmark.rs"
harness = false
