apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentenv-scheduler-discovery
rules:
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  # Leader election (#259): the scheduler competes for a Lease when
  # leader_election.enabled is set. Inert otherwise.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
