apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentenv-web
  labels:
    app.kubernetes.io/name: agentenv-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentenv-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentenv-web
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: web
          image: agentenv-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: AENV_DEFAULT_GATEWAY_URL
              value: http://agentenv-gateway:8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
