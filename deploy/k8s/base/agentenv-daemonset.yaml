apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agentenv-node
  labels:
    app.kubernetes.io/name: agentenv-node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agentenv-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentenv-node
    spec:
      terminationGracePeriodSeconds: 3600
      nodeSelector:
        kubernetes.io/os: linux
      initContainers:
        # ublk_drv must be loaded in the host kernel before the server's startup
        # check runs. chroot into the host root so modprobe resolves modules for
        # the node's running kernel instead of the container image.
        - name: load-ublk
          image: agentenv-runtime:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - "-c"
            - |
              chroot /host modprobe ublk_drv
              chroot /host ls -l /dev/ublk-control
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
        # The workspace hostPath is mounted over /workspace and shadows the
        # runtime assets baked into the image at /workspace/env. Seed them into
        # the host directory so the server does not re-download them at startup.
        # --update=none keeps existing host state untouched.
        - name: seed-deps
          image: agentenv-runtime:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - "-c"
            - |
              mkdir -p /host-workspace/env
              cp -a --update=none /workspace/env/. /host-workspace/env/
          volumeMounts:
            - name: workspace
              mountPath: /host-workspace
      containers:
        - name: agentenv
          image: agentenv-runtime:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AENV_CONFIG_PATH
              value: /workspace/config/agentenv.toml
            - name: AENV_VIRTUALIZATION_MODE
              value: "kvm"
            - name: API_ADDR
              value: "0.0.0.0:8000"
            - name: AENV_UBLK_DAEMON_BINARY_PATH
              value: /usr/local/bin/uvm-ublk-daemon
            - name: AENV_UBLK_DAEMON_METRICS_LISTEN_ADDR
              value: "0.0.0.0:9103"
            - name: AENV_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AENV_OBSERVABILITY_SCHEDULER_REPORT_ENABLED
              value: "true"
            - name: AENV_OBSERVABILITY_SCHEDULER_ENDPOINT
              value: http://agentenv-scheduler:9090
            - name: AENV_SANDBOX_PROXY_DOMAINS
              valueFrom:
                configMapKeyRef:
                  name: sandbox-proxy-config
                  key: SANDBOX_PROXY_DOMAINS
                  optional: true
            # Both the main runtime and the firecracker pool runtime size
            # themselves from the host's core count, which on a large node means
            # hundreds of worker threads. Every one of them takes a jemalloc
            # arena and inflates the address space, and the sandbox start path
            # spawns helper processes (iptables, ip) whose cost scales with it.
            - name: TOKIO_WORKER_THREADS
              value: "32"
            # jemalloc defaults to 4x the core count in arenas and holds dirty
            # pages for 10s, which lets RSS stay high long after one-off work
            # such as image conversion. Capping arenas and shortening decay
            # keeps the resident set an order of magnitude smaller.
            - name: _RJEM_MALLOC_CONF
              value: narenas:8,dirty_decay_ms:1000,muzzy_decay_ms:0,background_thread:true
          ports:
            - name: http
              containerPort: 8000
            - name: ublk-metrics
              containerPort: 9103
          resources:
            requests:
              # Kubernetes derives oom_score_adj from requests.memory:
              #   oom_score_adj = 1000 - 1000 * (requests.memory / node_capacity)
              # Without this, requests.memory defaults to 0 and oom_score_adj is
              # set to 1000, the same as firecracker child processes, offering no
              # protection. Setting some value ensures the agentenv container gets an
              # oom_score_adj well below 1000, so it is killed after firecracker
              # child processes (whose oom_score_adj we explicitly set to 1000) when
              # the host runs out of memory. Change this value accordingly.
              memory: 8Gi
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - "-c"
                  - |
                    echo "preStop: waiting for sandboxes to drain..."
                    while true; do
                      count=$(curl -sf -H 'X-API-Key: preStop' http://localhost:8000/sandboxes | jq 'length') || count=""
                      if [ -z "$count" ]; then
                        echo "preStop: failed to query sandbox count, retrying..."
                        sleep 3
                        continue
                      fi
                      echo "preStop: $count sandbox(es) remaining"
                      if [ "$count" = "0" ]; then
                        echo "preStop: all sandboxes drained, exiting"
                        break
                      fi
                      sleep 3
                    done
            postStart:
              exec:
                command:
                  - /bin/sh
                  - "-c"
                  - |
                    # cgroup v2: disable group OOM kill for this container's cgroup.
                    # By default Kubernetes sets memory.oom.group=1, which means
                    # the entire cgroup (including the agentenv server) is killed
                    # whenever any process inside it is OOM-killed. Setting it to 0
                    # makes the OOM killer target individual processes, so a
                    # firecracker child being killed does not take down the server.
                    CGROUP="$(awk -F: '/^0::/{print $3}' /proc/self/cgroup)"
                    echo 0 > /sys/fs/cgroup/$CGROUP/memory.oom.group
          securityContext:
            privileged: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: agentenv-config
              mountPath: /workspace/config/agentenv.toml
              subPath: agentenv.toml
              readOnly: true
            - name: host-dev
              mountPath: /dev
      volumes:
        - name: workspace
          hostPath:
            path: /var/lib/aenv
            type: DirectoryOrCreate
        - name: agentenv-config
          configMap:
            name: agentenv-k8s-config
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
